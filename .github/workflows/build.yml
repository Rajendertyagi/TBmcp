name: Build (manual)

# Manual, release-only Nuitka onefile build. This workflow NEVER runs on push
# or PR — it only starts when you click "Run workflow" on GitHub. CI
# (ci.yml) validates the code; this produces the .exe on demand.
#
# Usage: Actions -> "Build (manual)" -> Run workflow
# Artifact: TBMcp.exe (onefile, includes the frontend + zeromcp engine)

on:
  workflow_dispatch:

jobs:
  nuitka:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.3"

      - name: Create venv
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka

      - name: Build exe
        run: uv run python -m nuitka --onefile --mingw64 --assume-yes-for-downloads --include-package=zeromcp --include-data-dir=frontend=frontend --include-package=falcon,waitress,requests --output-filename=TBMcp.exe main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBMcp-exe
          path: TBMcp.exe
