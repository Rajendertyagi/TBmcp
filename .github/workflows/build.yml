name: Build (manual)

# Manual, release-only Nuitka onefile build. This workflow NEVER runs on push
# or PR — it only starts when you click "Run workflow" on GitHub. CI
# (ci.yml) validates the code; this produces the .exe on demand.
#
# Usage: Actions -> "Build (manual)" -> Run workflow
# Artifact: TBMcp.exe (onefile, includes the frontend + zeromcp engine)

on:
  workflow_dispatch:

jobs:
  nuitka:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # MSVC environment initialization
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          # UPDATED: Upgraded to Python 3.13 (Nuitka's MinGW64 does NOT work
          # on Python 3.13+, so we build with the MSVC toolchain instead).
          python-version: "3.13"

      # Re-creates the venv specifically targeting the new 3.13 runtime
      - name: Create venv
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka

      # Compiler cache key updated to isolate 3.13 build objects from 3.12
      - name: Cache Nuitka compiler build cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka
          key: ${{ runner.os }}-nuitka-3.13-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-3.13-

      # Compiling Python 3.13 using the native MSVC toolchain
      - name: Build exe
        run: uv run python -m nuitka --onefile --msvc=latest --assume-yes-for-downloads --include-package=zeromcp --include-data-dir=frontend=frontend --include-package=falcon,waitress,requests --output-filename=TBMcp.exe main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBMcp-exe
          path: TBMcp.exe
          if-no-files-found: error
