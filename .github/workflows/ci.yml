name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          # Pin the interpreter so CI matches the Nuitka build (build.yml) and
          # the repo's .python-version.
          python-version: "3.13"

      - name: Create venv
        run: uv sync

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q \
            -x "(\.venv|__pycache__|frontend)([\\/]|$)" \
            .

      - name: CLI help smoke test
        run: python main.py --help

      - name: Offline test suite (unit + integration, no broker)
        run: python -m pytest
