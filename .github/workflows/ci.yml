name: CI

# Automatic checks on every push/PR, PLUS manual trigger from the Actions tab
# ("Run workflow") so the pipeline can be re-verified on demand without a push.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          # Pin the interpreter so CI matches the Nuitka build (build.yml) and
          # the repo's .python-version.
          python-version: "3.13"

      - name: Create venv
        run: uv sync

      # NOTE: every step must go through `uv run` — it resolves the project
      # venv (Python 3.13 + pytest). A bare `python` on the runner is the
      # system interpreter (/usr/bin/python) which has no project deps.
      - name: Syntax check (compileall)
        run: |
          uv run python -m compileall -q \
            -x "(\.venv|__pycache__|frontend)([\\/]|$)" \
            .

      - name: CLI help smoke test
        run: uv run python main.py --help

      - name: Offline test suite (unit + integration, no broker)
        run: uv run pytest
