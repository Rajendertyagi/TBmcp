name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.3"

      - name: Create venv
        run: uv sync

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q \
            -x "(\.venv|__pycache__|frontend|zeromcp)([\\/]|$)" \
            .

      - name: CLI help smoke test
        run: python main.py --help

      - name: Offline test suite (unit + integration, no broker)
        run: python -m pytest
